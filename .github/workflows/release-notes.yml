name: Generate and Archive Release Notes

# Trigger this workflow when a new version tag is pushed (e.g., v1.0.0, v2.1.3)
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create_release_and_artifact:
    name: Draft and Publish Release Notes
    runs-on: ubuntu-latest

    permissions:
      contents: write     
      pull-requests: read  # Allows reading merged PRs for changelog

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Generate and publish release notes
      - name: Generate and Publish Release
        id: release_notes
        uses: release-drafter/release-drafter@v6
        with:
          publish: true               # Publishes release automatically
          config-name: release-drafter.yml  # Reads configuration from .github/release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Save generated release notes to a file
      - name: Save Release Notes to File
        if: success()
        run: |
          echo "${{ steps.release_notes.outputs.body }}" > release-notes.md
          echo "Release notes saved to release-notes.md"

      # Step 4: Upload the release notes file as an artifact
      - name: Upload Release Notes as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ github.ref_name }} # e.g., release-notes-v1.2.3
          path: release-notes.md
