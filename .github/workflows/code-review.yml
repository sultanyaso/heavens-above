name: Code Review Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger for testing

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ESLint
        run: npm run lint || echo "Lint skipped"

      - name: Security audit
        run: npm audit --production || echo "No vulnerabilities found"
