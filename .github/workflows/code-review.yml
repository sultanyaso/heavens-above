name: Code Review

on:
  pull_request:
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Run code quality check
        run: npm run code-quality # Assumes a script for tools like SonarQube or CodeClimate
        continue-on-error: true

      - name: Security scan
        uses: github/codeql-action/analyze@v3
        with:
          category: security
          languages: javascript

      - name: Comment on PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lintReport = fs.existsSync('lint-report.json') ? JSON.parse(fs.readFileSync('lint-report.json')) : {};
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Linting completed. Issues found: ${lintReport.errors || 0}.`
            });
