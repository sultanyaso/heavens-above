name-template: 'v$NEXT_PATCH_VERSION 🚀'
tag-template: 'v$NEXT_PATCH_VERSION'

categories:
  - title: ' New Features'
    labels:
      - feature
      - enhancement
  - title: ' Bug Fixes'
    labels:
      - bug
  - title: ' Maintenance'
    labels:
      - chore
      - cleanup
      - refactor

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
no-changes-template: 'No significant changes in this release.'

template: |
  ##  What’s Changed
  $CHANGES

  **Full Changelog:** https://github.com/sultanyaso/heavens-above/compare/$PREVIOUS_TAG...$NEW_TAG
